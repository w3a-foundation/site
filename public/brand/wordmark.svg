<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-labelledby="title desc">
  <title id="title">W3A — Web3 Alliance wordmark</title>
  <desc id="desc">Horizontal wordmark of the Web3 Alliance. A solid downward-pointing triangle icon precedes the short mark "W3A" set in EB Garamond, followed by the long mark "WEB3 ALLIANCE" set in Jost letter-spaced at 0.18em. Black on transparent white.</desc>
  <rect width="320" height="64" fill="none"/>
  <!-- Icon: triangle, vertically centered, 28px tall -->
  <polygon points="6,20 42,20 24,50" fill="#000000"/>
  <!-- Short mark: W3A in EB Garamond -->
  <text x="58" y="44" font-family="EB Garamond, Garamond, Georgia, serif" font-size="34" font-weight="600" letter-spacing="-0.01em" fill="#000000">W3A</text>
  <!-- Long mark: WEB3 ALLIANCE in Jost, all caps, wide tracking -->
  <text x="134" y="42" font-family="Jost, Inter, system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="0.18em" fill="#333333">WEB3 ALLIANCE</text>
</svg>
